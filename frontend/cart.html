<!DOCTYPE html>
<html>
<head>
    <title>Your Cart | Covers Palette</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">
    <div class="logo-container">
        <img src="images/logo.jpeg" class="logo-img">
        <span class="logo-text">Covers Palette</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="gallery.html">Gallery</a>
        <a href="order.html">Order</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html" class="cart-icon">🛒</a>
    </nav>
</header>

<h1>Your Cart 🛒</h1>

<div id="cartItems"></div>
<h2 id="total"></h2>

<div class="cart-buttons">
    <button onclick="clearCart()" class="clear-cart-btn">Clear Cart</button>
    <button onclick="placeOrder()" class="place-order-btn">Place Order 📦</button>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let total = 0;
let data = "";

cart.forEach((item, index) => {
    total += item.price * item.quantity;

    data += `
        <div class="card">
            <img src="${item.image}" class="cart-image">

            <h3>${item.name}</h3>
            <p>₹${item.price}</p>

            <div class="quantity-box">
                <button onclick="decreaseQty(${index})">-</button>
                <span>${item.quantity}</span>
                <button onclick="increaseQty(${index})">+</button>
            </div>

            <button onclick="removeItem(${index})" class="remove-btn">
                Remove
            </button>
        </div>
    `;
});

document.getElementById("cartItems").innerHTML =
    data || "<p class='empty-cart'>Your cart is empty 🤎</p>";

document.getElementById("total").innerText =
    cart.length > 0 ? "Total : ₹" + total : "";

function increaseQty(index){
    cart[index].quantity++;
    localStorage.setItem("cart", JSON.stringify(cart));
    location.reload();
}

function decreaseQty(index){
    if(cart[index].quantity > 1){
        cart[index].quantity--;
    }else{
        cart.splice(index,1);
    }

    localStorage.setItem("cart", JSON.stringify(cart));
    location.reload();
}

function removeItem(index){
    cart.splice(index,1);
    localStorage.setItem("cart", JSON.stringify(cart));
    location.reload();
}

function clearCart(){
    localStorage.removeItem("cart");
    location.reload();
}

function placeOrder(){
    if(cart.length === 0){
        alert("Cart Empty 🤎");
        return;
    }

    window.location.href = "order.html";
}
</script>

</body>
</html>
